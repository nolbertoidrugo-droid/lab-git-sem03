<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto - Astronomía Aficionada</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #0b0d17; color: #e0e6ed; margin: 0; padding: 20px;">

    <nav style="background-color: #16192b; padding: 15px; border-radius: 8px; text-align: center;">
        <a href="index.html" style="color: #ffffff; margin: 0 15px; text-decoration: none;">Inicio</a>
        <a href="about.html" style="color: #ffffff; margin: 0 15px; text-decoration: none;">Sobre Nosotros</a>
        <a href="contact.html" style="color: #4da6ff; margin: 0 15px; text-decoration: none; font-weight: bold;">Contacto</a>
    </nav>

    <main style="max-width: 800px; margin: 40px auto; padding: 20px; background-color: #16192b; border-radius: 8px;">
        <h1 style="color: #4da6ff;">Ponte en Contacto</h1>
        <p style="line-height: 1.6;">¿Tienes alguna pregunta sobre qué equipo comprar o quieres unirte a nuestras observaciones grupales? Déjanos tu mensaje.</p>
        
        <form style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
            <label style="display: flex; flex-direction: column;">
                Nombre:
                <input type="text" style="padding: 8px; margin-top: 5px; border-radius: 4px; border: 1px solid #4da6ff; background-color: #0b0d17; color: #fff;">
            </label>
            <label style="display: flex; flex-direction: column;">
                Correo Electrónico:
                <input type="email" style="padding: 8px; margin-top: 5px; border-radius: 4px; border: 1px solid #4da6ff; background-color: #0b0d17; color: #fff;">
            </label>
            <label style="display: flex; flex-direction: column;">
                Mensaje:
                <textarea rows="4" style="padding: 8px; margin-top: 5px; border-radius: 4px; border: 1px solid #4da6ff; background-color: #0b0d17; color: #fff;"></textarea>
            </label>
            <button type="submit" style="padding: 10px; background-color: #4da6ff; color: #0b0d17; font-weight: bold; border: none; border-radius: 4px; cursor: pointer;">Enviar</button>
        </form>
    </main>

</body>
</html>
